name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build PartyOffline
        run: dotnet build src/PartyOffline/PartyOffline.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $out = 'src/PartyOffline/bin/Release/net472'
          $stage = 'stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$out/PartyOffline.exe" $stage
          Copy-Item "$out/PartyOffline.exe.config" $stage
          Copy-Item 'LICENSE' $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "LOLPartyOffline.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: LOLPartyOffline
          path: LOLPartyOffline.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LOLPartyOffline.zip
